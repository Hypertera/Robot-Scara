
name: Build ControlSCARA

on:
  push:
    tags:
      - "control-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ControlSCARA
        run: |
          pyinstaller ControlSCARA.spec --clean

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ControlSCARA/* -DestinationPath ControlSCARA-Windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/ControlSCARA.app ControlSCARA-macOS.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../ControlSCARA-Linux.zip ControlSCARA

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlSCARA-${{ matrix.name }}
          path: ControlSCARA-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ControlSCARA-*
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
