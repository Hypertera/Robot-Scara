name: Build Simulador SCARA

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Windows x64
            os: windows-latest
            artifact_name: Simulador_SCARA_Windows_x64
            archive_name: Simulador_SCARA_Windows_x64.zip

          - name: Linux x64
            os: ubuntu-latest
            artifact_name: Simulador_SCARA_Linux_x64
            archive_name: Simulador_SCARA_Linux_x64.tar.gz

          - name: macOS Intel
            os: macos-15-intel
            artifact_name: Simulador_SCARA_macOS_Intel
            archive_name: Simulador_SCARA_macOS_Intel.zip

          - name: macOS ARM64
            os: macos-15
            artifact_name: Simulador_SCARA_macOS_ARM64
            archive_name: Simulador_SCARA_macOS_ARM64.zip

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Build application
        run: |
          pyinstaller --clean --noconfirm Simulador_SCARA.spec

      - name: Inspect build output
        shell: bash
        run: |
          echo "===== DIST ====="
          find dist -maxdepth 4 -print
          echo "===== BUILD ====="
          find build -maxdepth 3 -print

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/Simulador_SCARA_by_Hypertera" `
            -DestinationPath "${{ matrix.archive_name }}"

      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "../${{ matrix.archive_name }}" \
            "Simulador_SCARA_by_Hypertera.app"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          tar -czf \
            "${{ matrix.archive_name }}" \
            -C dist \
            "Simulador_SCARA_by_Hypertera"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}


  release:
    name: Create GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "Simulador SCARA ${{ github.ref_name }}" \
            --generate-notes